<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VB Estação de Fotos</title>
<style>
:root{--brown:#6b472f;--bg:#f5f2ee;--ink:#171717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
main{max-width:520px;margin:auto;padding:24px 18px 40px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #00000012}
h1{font-size:28px;margin:0 0 6px}
.sub{color:#666;margin:0 0 22px}
input[type=file]{display:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;background:var(--brown);color:#fff;font-size:17px;font-weight:700;text-align:center}
#preview{display:none;width:100%;margin:18px 0;border-radius:14px;background:#eee}
#status{min-height:24px;text-align:center;margin:14px 0;color:#555}
.actions{display:none;gap:10px;margin-top:12px}
.actions .btn{flex:1}
.secondary{background:#eee;color:#222}
.small{font-size:12px;color:#777;text-align:center;margin-top:16px}
canvas{display:none}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>VB Estação de Fotos</h1>
    <p class="sub" id="eventName">Caio & Brenda</p>

    <label class="btn" for="photo">ESCOLHER FOTO</label>
    <input id="photo" type="file" accept="image/*" capture="environment">

    <img id="preview" alt="Prévia da foto">
    <div id="status"></div>

    <div class="actions" id="actions">
      <button class="btn" id="download">BAIXAR FOTO</button>
      <button class="btn secondary" id="again">ESCOLHER OUTRA</button>
    </div>

    <p class="small">A foto é montada no próprio navegador.</p>
  </div>
</main>
<canvas id="canvas" width="827" height="1170"></canvas>

<script>
const W=827, H=1170;
const frameSrc="Caio&Brenda.png";
const fileInput=document.getElementById("photo");
const preview=document.getElementById("preview");
const status=document.getElementById("status");
const actions=document.getElementById("actions");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const params=new URLSearchParams(location.search);
if(params.get("evento")) document.getElementById("eventName").textContent=params.get("evento");

function cover(img,w,h){
  const s=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
  return {x:(w-dw)/2,y:(h-dh)/2,w:dw,h:dh};
}

fileInput.addEventListener("change", async ()=>{
  const file=fileInput.files?.[0];
  if(!file) return;
  status.textContent="Montando sua foto…";
  actions.style.display="none";

  const photo=await loadImage(URL.createObjectURL(file));
  const frame=await loadImage(frameSrc);

  ctx.clearRect(0,0,W,H);
  const r=cover(photo,W,H);
  ctx.drawImage(photo,r.x,r.y,r.w,r.h);
  ctx.drawImage(frame,0,0,W,H);

  preview.src=canvas.toDataURL("image/jpeg",0.96);
  preview.style.display="block";
  actions.style.display="flex";
  status.textContent="Foto pronta para impressão.";
});

document.getElementById("download").onclick=()=>{
  const a=document.createElement("a");
  a.download="VB-Estacao-de-Fotos.jpg";
  a.href=canvas.toDataURL("image/jpeg",0.96);
  a.click();
};

document.getElementById("again").onclick=()=>{
  fileInput.value="";
  preview.style.display="none";
  actions.style.display="none";
  status.textContent="";
};

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const i=new Image();
    i.onload=()=>resolve(i);
    i.onerror=reject;
    i.src=src;
  });
}
</script>
</body>
</html>
